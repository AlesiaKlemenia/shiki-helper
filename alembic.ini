# Конфигурация Alembic для Shiki-Helper
# Документация: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Путь к директории миграций
script_location = migrations

# Шаблон имён файлов миграций
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Кодировка исходного файла миграции
output_encoding = utf-8

# DATABASE_URL берётся из env.py через app.config.settings
# Не задаём sqlalchemy.url здесь — он устанавливается программно в env.py

[post_write_hooks]
# Автоформатирование сгенерированных миграций через ruff
hooks = ruff
ruff.type = exec
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
